<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang thông báo</title>
  </head>
  <body>
    <h1>Chào mừng bạn đến với trang HTML</h1>
    <button id="notifyBtn">Bấm vào tôi</button>

    <script>
      document.getElementById("notifyBtn").addEventListener("click", function () {
        alert("Bạn vừa bấm vào nút!");
      });
    </script>
  </body>
</html>
